// ===================== WORLD: THE TRENCH =====================
// One fixed level. Built from a seeded random so it's identical every run (hand-shaped, just not hand-typed).
// A wide mouth narrows into a tight throat where the creature waits, then opens into the Atlantis cavern.
// Everything solid is a polygon: { pts, kind ('rock' | 'ruin'), bbox x0..x1 / y0..y1, segs (edges + tangents) }.
let seed = 20261027;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const LEVEL_W = 2000, LEVEL_BOTTOM = 5900;
const CAVERN_FLOOR = 5440;     // top of the Atlantis cavern floor
const THROAT_Y = 3350;         // narrowest part, where the creature waits
const trenchCenter = y => 1000 + 150 * Math.sin(y / 850) + 60 * Math.sin(y / 310 + 1);
// Half width of open water at each depth, smoothly blended between these keys
const WIDTH_KEYS = [[-400, 900], [300, 700], [1400, 400], [2400, 340], [3000, 320], [3600, 310], [4050, 450], [4500, 900], [LEVEL_BOTTOM, 950]];
function trenchHalfWidth(y) {
  for (let i = 1; i < WIDTH_KEYS.length; i++) {
    const [y0, w0] = WIDTH_KEYS[i - 1], [y1, w1] = WIDTH_KEYS[i];
    if (y <= y1) { const f = Math.max(0, Math.min(1, (y - y0) / (y1 - y0))), s = f * f * (3 - 2 * f); return w0 + (w1 - w0) * s; }
  }
  return WIDTH_KEYS[WIDTH_KEYS.length - 1][1];
}
// Jagged wall faces: smooth wander + random chips every WALL_STEP px
const WALL_STEP = 45, wallL = [], wallR = [];
for (let y = -400; y <= LEVEL_BOTTOM; y += WALL_STEP) {
  const c = trenchCenter(y), hw = trenchHalfWidth(y), jag = () => (srand() - 0.5) * 44;
  wallL.push([c - hw + 32 * Math.sin(y / 97) + 18 * Math.sin(y / 37 + 2) + jag(), y]);
  wallR.push([c + hw + 32 * Math.sin(y / 113 + 1) + 18 * Math.sin(y / 43) + jag(), y]);
}
// x of a wall face at depth y (side -1 = left, 1 = right)
function wallX(side, y) {
  const a = side < 0 ? wallL : wallR, i = Math.max(0, Math.min(a.length - 2, Math.floor((y + 400) / WALL_STEP)));
  return a[i][0] + (a[i + 1][0] - a[i][0]) * (y - a[i][1]) / WALL_STEP;
}
const SOLIDS = [];
function addSolid(pts, kind = 'rock') {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), segs = [];
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], l = Math.hypot(bx - ax, by - ay) || 1;
    segs.push({ ax, ay, bx, by, tx: (bx - ax) / l, ty: (by - ay) / l });
  }
  SOLIDS.push({ pts, kind, segs, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) });
}
const box = (x, y, w, h, kind = 'ruin') => addSolid([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], kind);
// The two walls (everything outside the faces is rock)
addSolid([[-600, -400], ...wallL, [-600, LEVEL_BOTTOM]]);
addSolid([[LEVEL_W + 600, -400], ...wallR, [LEVEL_W + 600, LEVEL_BOTTOM]]);
// Cavern floor: bumpy, rising toward the walls like a bowl
{
  const pts = [];
  for (let x = -100; x <= LEVEL_W + 200; x += 70) {
    const edge = Math.max(0, Math.abs(x - trenchCenter(5400)) - 650);
    pts.push([x, CAVERN_FLOOR + 28 * Math.sin(x / 130) + 14 * Math.sin(x / 47) + (srand() - 0.5) * 18 - edge * 0.45]);
  }
  addSolid([...pts, [LEVEL_W + 200, LEVEL_BOTTOM + 100], [-100, LEVEL_BOTTOM + 100]]);
}
// Overhanging ledges sticking out of a wall, sloping down. Returns a spot on top (for loot).
function ledge(side, y, len) {
  const wx = wallX(side, y), d = -side;
  addSolid([[wx - d * 40, y - 25], [wx + d * len, y + 5], [wx + d * len * 0.7, y + 22], [wx + d * len * 0.3, y + 36], [wx - d * 40, y + 50]]);
  return [wx + d * len * 0.5, y - 30];
}
// Lumpy floating boulders. Returns a spot on top.
function boulder(x, y, r) {
  const pts = [];
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = r * (0.75 + srand() * 0.4); pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8]); }
  addSolid(pts);
  return [x, y - r - 10];
}

{ const pts = []; for (let i = 0; i <= 16; i++) { const a = Math.PI + i / 16 * Math.PI; pts.push([RX + 690 + Math.cos(a) * 105, F - 140 + Math.sin(a) * 105]); } addSolid(pts, 'ruin'); }

}

function solidAt(x, y) {
  for (const s of SOLIDS) if (x > s.x0 && x < s.x1 && y > s.y0 && y < s.y1 && inPoly({ x, y }, s.pts)) return true;
  return false;
}

function settle([x, y], half) {
  for (let i = 0; i < 200 && solidAt(x, y + half); i++) y -= 4;
  for (let d = 0; d < 500; d += 2) if (solidAt(x, y + half + d + 1)) return [x, y + d];
  return [x, y];
}

                    [wallX(-1, 1100) + 45, 1100], [wallX(1, 2200) - 45, 2200], [wallX(-1, 2900) + 45, 2900], [wallX(1, 3900) - 45, 3900],

  bus.muffle.frequency.setTargetAtTime(cut, at(), 0.15);

// ===================== TERMINAL LOG =====================
function log(t, sev = 'warn') {

  if (logLines.length > 40) logLines.shift();
  if (time > 0 && power()) tone(sev === 'bad' ? 300 : sev === 'good' ? 990 : 600, 0.07);
}

// ===================== DIVES + QUOTA =====================

  // Fresh loot every dive: the bait by the creature, a couple in the trench, most of it in the ruins
  const pick = (list, n, value) => shuffle(list).slice(0, n).map(([x, y]) => ({ x, y, value, state: 'free' }));
  relics = [...pick(RELIC_BAIT, 2, RELIC_VALUE), ...pick(RELIC_UPPER, UPPER_RELICS_PER_DIVE, RELIC_VALUE_UPPER),
            ...pick(RELIC_RUINS, RUIN_RELICS_PER_DIVE, RELIC_VALUE_RUINS)];
  scraps = shuffle(SCRAP_POOL).slice(0, SCRAP_PER_DIVE).map(([x, y]) => ({ x, y, state: 'free', type: SCRAP_MIX[Math.floor(Math.random() * SCRAP_MIX.length)] }));
  dots = []; pings = []; echoes = [];

}
function launch() {

}
function endDive() {

    if (paid < quota) return fail('QUOTA MISSED');

    quota = Math.round(quota * QUOTA_GROWTH / 50) * 50; paid = 0;
  }

}
function payQuota() {

  coins -= pay; paid += pay; log(`PAID ${pay} TOWARD QUOTA`, 'good');
}
function buyHull() {

  coins -= HULL_HIT_COST; sub.hp = Math.min(MAX_HP, sub.hp + HIT_DAMAGE); log(`HULL +${HIT_DAMAGE}`, 'good');

function fail(reason) {

// ===================== POWER + AIR =====================
// Engine shutdown: report shows right away, engine stops REPORT_LEAD later. Type is fixed now, never re-rolled.
function engineShutdown(report) {

  if (report === 'malfunction') engWater = Math.max(engWater, BAY_FLOOD);   // the bay floods behind its sealed door
  if (report === 'prevention') { log('! ENGINE MALFUNCTION PREVENTION', 'warn'); tone(180, 0.4, 0, 'square', 0.06); }
  else if (report === 'malfunction') { log('X ENGINE MALFUNCTION', 'bad'); tone(300, 0.12); tone(300, 0.12, 0.18); }

}
function updatePower(dt) {
  if (engine.stopIn > 0 && (engine.stopIn -= dt) <= 0) { engine.stopIn = 0; engine.state = 'off'; }
  if (gen.boot > 0 && (gen.boot -= dt) <= 0) {
    gen.boot = 0; sys = { sonar: true, pump: false, lights: true }; // power-on resets the panel switches
    log('SYSTEMS ONLINE', 'good');

    if (fuel <= 0) { fuel = 0; engineShutdown('fuel'); }

}

// ===================== WATER =====================
// ----- Water -----
// Two compartments. Levels are fractions of each room's height; volumes are compared in "cabin units"
// (the engine room holds ENG_RATIO of what the cabin does). Surfaces stay level with the world (so they slant
// when the sub tilts) and slosh when the sub speeds up or slows down.
const CREW_FLOOR = 41, CREW_TOP = -36, ENG_FLOOR = -3, ENG_TOP = -45;

const crewSurfY = () => CREW_FLOOR - water * (CREW_FLOOR - CREW_TOP);

const waterLineLocal = crewSurfY;
// Surface height at a given x: level, tilted to stay flat in the world, plus slosh
const surfaceSlope = () => -Math.tan(visAng()) + slosh.a;
const crewSurfAt = x => crewSurfY() + surfaceSlope() * (x - 50);

    // Dead propeller + open bay = the sea comes in through the shaft, into the engine room

  }

  // into the cabin whenever the door is open; cabin water flows back only once it's above the engine room floor.

      engWater -= dv / ENG_RATIO; water += dv; doorStream = dv / dt;

    else if ((pumpSpark += dt) >= DRY_SPARK_TIME) {
      parts.pumpMech.dead = true; pumpSpark = 0; air = Math.max(0, air - PUMP_BLAST_AIR);
      kick(SHAKE_WALL * 2, 0); SFX.boom(); log('PUMP EXPLODED (RAN DRY)', 'bad');
    }
  } else pumpSpark = 0;
  // Water in the electrics: above WATER_SHORT the terminal shorts out until the cabin is (nearly) dry again
  if (!termShorted && water > WATER_SHORT) { termShorted = true; log('WATER IN THE ELECTRICS - TERMINAL SHORTED', 'bad'); SFX.zap(); }
  else if (termShorted && water < WATER_DRY) { termShorted = false; log('TERMINAL DRY - BACK ONLINE', 'good'); }

// Can you sit? Not with your hands full, stumbling, away from the chair, or with the seat under water
const seatUnderWater = () => crewSurfAt(CHAIR_X - 3) < CHAIR_HEAD_Y;

// ===================== DAMAGE =====================
function kick(amp, bias) { shake = SHAKE_TIME; shakeAmp = Math.max(shakeAmp * (shake / SHAKE_TIME), amp); shakeBias = bias; }
function stumble(dirX) {
  if (mode === 'seated') return;
  grip = null; inv.open = false;
  fig.stun = STUMBLE_TIME; fig.vx = (dirX || (Math.random() < 0.5 ? -1 : 1)) * STUMBLE_SPEED;
}
function damageHull(n) {
  sub.hp = Math.max(0, sub.hp - n);
  if (sub.hp === 0) fail('HULL IMPLODED');
}
function armHit() {
  arm.hits++; log('ARM TOOK THE HIT', 'warn');
  if (arm.hits >= ARM_MAX_HITS) {
    arm.broken = true; log('ARM BROKEN', 'bad');
    if (arm.held) { arm.held.state = 'free'; arm.held = null; }
  }
}
// A part on the hull side that hit: 'slotN' = whatever module sits in slot N
const partRef = id => id.startsWith('slot') ? moduleIn(+id[4]) : parts[id];

    if (lost.length) { const it = lost[Math.floor(Math.random() * lost.length)]; items.splice(items.indexOf(it), 1); log(`STORAGE HIT - LOST A ${ITEM_TYPES[it.type].short}`, 'bad'); }
    else log('STORAGE BROKEN', 'bad');

// Creature contact: big shake from the engine side. Always breaks the engine; works through propeller -> engine -> panel.

  engineShutdown('malfunction');

  if (pr.imm <= 0) {

    } else if (pr.broken && !parts.panel.broken && Math.random() < 0.5) breakPart('panel');

// ===================== INPUT =====================
addEventListener('keydown', e => {

  if (mode === 'seated') {

  }

    else if (b && b.type) { const it = items.find(i => i.where === 'storage' && i.type === b.type); it.where = 'hand'; carry = it; log(`TOOK A ${ITEM_TYPES[b.type].short}`, 'good'); SFX.clink(); }
    inv.open = false; return;

addEventListener('mouseup', e => { if (e.button === 0) { mouse.down = false; grip = null; } if (e.button === 2) mouse.rdown = false; });

function toggleSystem(id) {

function toggleSeat() {

// ===================== THE HAND (standing) =====================
// The mouse steers his hand, like the robot arm but inside. Reach is limited, he can only reach in front of
// himself (turning takes a moment), and the hand can't go through walls (only through the open bay door).

let tipSeen = {}, tipQueue = [], tipNow = null, tipClock = 0;
try { tipSeen = JSON.parse(localStorage.getItem('atlantisSubTips') || '{}'); } catch (e) {}
function showTip(id) {
  if (tipSeen[id] || tipQueue.some(q => q.id === id) || (tipNow && tipNow.id === id)) return;
  tipQueue.push({ id, at: time });
}
function dismissTip() { if (tipNow) tipNow.t = Math.min(tipNow.t, 0.3); }
function checkTips() {
  if (sub.dead) return;
  if (phase === 'dock') showTip(divesDone ? 'dock2' : 'dock');
  if (phase !== 'dive') return;
  showTip('dive');
  if (mode === 'standing') showTip('stand');
  if (Object.values(parts).some(p => p.worn || p.broken) || modules.some(m => m.worn || m.broken)) showTip('damaged');
  if (items.some(i => i.where === 'floor')) showTip('floor');
  if (engine.state === 'off' && engine.report === 'malfunction') showTip('malfunction');
  if (engine.state === 'off' && engine.report !== 'fuel') showTip('engine');
  if (water > 0.12) showTip('water');
  if (!power()) showTip('power');
  if (air < 0.6 && !airMaking()) showTip('air');
  if (parts.panel.broken) showTip('frozen');
  if (parts.storage.broken) showTip('storage');
  if (fuel < 0.25) showTip('fuel');
}
function updateTips(dt) {
  if ((tipClock -= dt) <= 0) { checkTips(); tipClock = 0.25; }
  if (tipNow && tipNow.id.startsWith('dock') && phase === 'dive') tipNow.t = Math.min(tipNow.t, 0.3);   // left the dock
  if (tipNow && (tipNow.t -= dt) <= 0) tipNow = null;
  tipQueue = tipQueue.filter(q => time - q.at < 15 && !tipSeen[q.id]);   // stale ones (the moment passed) wait for next time
  if (!tipNow && tipQueue.length) {
    const id = tipQueue.shift().id;
    tipNow = { id, text: TIPS[id], t: 5 + TIPS[id].length / 22, age: 0 };
    tipSeen[id] = true;
    try { localStorage.setItem('atlantisSubTips', JSON.stringify(tipSeen)); } catch (e) {}
  }

}

  }
  ctx.font = '12px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#7ab';
  const dbg = [`SPD ${Math.hypot(sub.vx, sub.vy).toFixed(0)}`, `CREATURE ${(Math.hypot(sub.x - creature.x, sub.y - creature.y) / 10).toFixed(0)} m`,
    `MODE ${mode}  FIG ${fig.x.toFixed(0)} face ${fig.face}`, `ENGINE ${engine.state}${engine.report ? ' ' + engine.report : ''}`, `RUN ${runTime.toFixed(0)}s  QUOTAS ${quotasMet}`, `GFX ${gfxHigh ? 'HIGH' : 'LOW'} (G)  ${(1000 / frameAvg).toFixed(0)} fps`];
  if (showDebug) dbg.forEach((t, i) => ctx.fillText(t, W - 12, 18 + i * 16));
  else { ctx.fillStyle = '#566'; ctx.fillText(`TAB: CONTROLS${muted ? '   SOUND OFF' : ''}`, W - 12, 18); }
  drawTip();

  if (sub.dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H / 2 - 60, W, 110);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f44'; ctx.font = 'bold 36px monospace';
    ctx.fillText(`SUNK: ${failReason}`, W / 2, H / 2 - 15);
    ctx.font = '15px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(`lasted ${Math.floor(runTime / 60)}:${String(Math.floor(runTime % 60)).padStart(2, '0')}  -  quotas met: ${quotasMet}  -  press R to start over`, W / 2, H / 2 + 20);
    if (DEATH_HINTS[failReason]) { ctx.fillStyle = '#9aa'; ctx.font = '12px monospace'; ctx.fillText(`next time: ${DEATH_HINTS[failReason]}`, W / 2, H / 2 + 42); }
  }
}

// ===================== LOOP =====================
let last = performance.now(), frameDt = 1 / 60;
function frame(now) {
  trackFrameTime(now - last);
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  frameDt = dt;
  if (!title) { update(dt); updateTips(dt); }
  updateAudio(dt);
  draw();
  requestAnimationFrame(frame);
}
resize(); buildTextures(); reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
