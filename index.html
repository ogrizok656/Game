<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dive Sub Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04101f; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===================== TUNING =====================
const THRUST        = 900;   // px/s^2 acceleration from WASD/arrows
const DRAG          = 2.2;   // per second; higher = stops sooner (top speed ~ THRUST/DRAG)
const SINK_ENABLED  = false; // constant downward drift on/off
const SINK_SPEED    = 35;    // px/s the sub drifts down to when you let go
const TILT_PER_SPEED= 0.0012;// radians of tilt per px/s of horizontal speed
const ROT_STIFFNESS = 40;    // how hard the sub rotates back toward its target tilt
const ROT_DAMPING   = 3.5;   // low = wobbly, high = stiff
const BOUNCE        = 0.45;  // fraction of impact speed kept after hitting rock
const HIT_SPEED     = 170;   // px/s into the wall needed to take damage
const HIT_DAMAGE    = 20;
const MAX_HP        = 200;   // carcass (main body). 0 = implosion
const IMMUNITY_TIME = 1.0;   // seconds of invulnerability after a hit
const DOT_FADE_TIME = 6.0;   // seconds before a sonar dot disappears
const MURK_RADIUS   = 380;   // px, hard cutoff: murky water kills the ping here, nothing past it echoes
const SOUND_SPEED   = 650;   // px/s the ping and its echo travel; lower = longer wait for dots
const PING_COOLDOWN = 0.7;   // seconds between pings while holding the mouse
const PING_SPREAD   = 0.9;   // radians, width of the ping cone (Math.PI * 2 = all around)
const PING_RAYS     = 70;    // resolution of each ping (= max dots per ping)
// Old, crappy sonar hardware (all effects scale with distance: 0 at the sub, full at MURK_RADIUS)
const SONAR_JITTER   = 0.07; // dot position error as a fraction of distance (0.07 = ~27px off at the murk edge)
const SONAR_DROPOUT  = 0.55; // chance a hit at the murk edge never comes back
const SONAR_DIST_FADE= 0.75; // how much dimmer far dots are (0 = no falloff, 1 = invisible at the edge)
const SONAR_GRID     = 6;    // px, dots snap to this coarse grid like a low-res display
const SONAR_NOISE    = 3;    // fake returns (static) per ping
const SONAR_FLICKER  = 0.3;  // chance each wave segment is missing on a given frame
const SONAR_COLOR    = '#5f9'; // phosphor green
const START_X = 600, START_Y = 100;
// Creature
const CREATURE_X        = 600;  // center, in the open pocket ~60% down the cave
const CREATURE_Y        = 2520;
const CREATURE_SIZE     = 70;   // blob diameter (collision + sonar use a circle)
const CREATURE_DAMAGE   = 30;   // per touch, no speed threshold
const CREATURE_KNOCKBACK= 500;  // px/s the sub gets flung away on contact
const CREATURE_DOT_FADE = 9.0;  // creature dots linger longer than rock dots
// Loot + arm
const RELIC_SIZE     = 16;     // px, square
const RELIC_VALUE    = 125;    // coins per relic sent up
const RELIC_COLOR    = '#fd3'; // sonar dot color for relics
const ARM_REACH      = 90;     // px from the arm's sliding base to the claw at full stretch
const ARM_SLIDE_SPEED= 120;    // px/s the arm base slides along its rail
const CLAW_RADIUS    = 6;      // grab tolerance around the claw tip
const TIE_TIME       = 1.5;    // seconds to tie a balloon on; stay within ARM_REACH or it cancels
const BALLOON_SPEED  = 400;    // px/s a ballooned relic rises
const ARM_MAX_HITS   = 2;      // hits taken while tying before the arm breaks
// Engine, power, terminal
const ENGINE_STALL_CHANCE  = 0.4;  // chance any hit stalls the engine (= power cut)
const ENGINE_RESTART_TIME  = 3.0;  // seconds the restart takes after pressing E at the engine
const TERMINAL_BACKUP_TIME = 7.0;  // the terminal runs on backup this long after a power cut, then dies
const ALARM_LIGHT_TIME     = 30;   // seconds the red alarm lights blink after a power cut
const ALARM_INTERVAL       = 1.5;  // seconds between alarm beeps while the lights blink
const PROP_SPIN            = 18;   // rad/s propeller spin while powered
const SHAKE_TIME           = 0.35; // seconds of screen shake per hit
const SHAKE_AMOUNT         = 14;   // screen px of shake at the start of a hit
// Modules
const MODULE_HP      = 3;      // hits a module survives; each impact damages the nearest module
// Crew / interior
const VIEW_ZOOM      = 2.6;    // camera scale on the sub (shrinks to fit small windows)
const SUB_VIS_TILT   = 0.5;    // how much of the physics wobble is drawn (keeps the interior readable)
const STAND_UP_TIME  = 0.5;    // seconds to get out of the chair
const WALK_SPEED     = 40;     // interior px/s
const CLIMB_SPEED    = 35;     // interior px/s on the ladder
const USE_RANGE      = 8;      // how close (interior px) the figure must be to use something
const STUMBLE_TIME   = 0.5;    // seconds of lost control after a hit while standing
const STUMBLE_SPEED  = 50;     // interior px/s the figure gets thrown
const HATCH_TURNS    = 2;      // full wheel turns to go from sealed to open
const HATCH_PASSABLE = 0.95;   // how open the hatch must be to walk through

// ===================== WORLD =====================
// Rock rectangles [x, y, w, h]. The open cave is roughly x 0..1200, y -50..4200.
const ROCKS = [
  [-300, -300, 300, 4800], [1200, -300, 300, 4800],  // outer walls
  [-300, -300, 1800, 250], [-300, 4200, 1800, 300],  // ceiling, floor
  [0, 300, 350, 200], [850, 500, 350, 300],           // upper narrowing
  [0, 900, 250, 500], [700, 1200, 500, 120],          // left bulge, right overhang shelf
  [950, 1500, 250, 600], [550, 1650, 80, 80],         // right wall chunk, small boulder
  [0, 1800, 450, 150], [500, 2000, 150, 100],         // left ledge, floating rock
  [800, 2300, 400, 150], [0, 2600, 300, 400],         // right shelf, left bulge
  [1000, 3000, 200, 500], [400, 3200, 250, 80],       // right wall, thin floating slab
  [0, 3500, 200, 700], [900, 3800, 300, 120],         // bottom left wall, last overhang
].map(([x, y, w, h]) => ({ x, y, w, h }));

// Relic centers [x, y], middle of the cave to the floor. The first two flank the creature (at 600, 2520).
const RELIC_SPOTS = [
  [490, 2545], [690, 2480],   // greed bait, right next to the creature
  [780, 2150], [250, 2200],   // middle, open water
  [900, 2750], [350, 3150],   // right pocket, beside the thin slab
  [700, 3700], [500, 4185],   // lower cave, resting on the floor
];

// ===================== SUB LAYOUT =====================
// Sub-local px, origin = sub position. Front (nose) is RIGHT, back is LEFT. About 235x125 total.
// A long bar on top runs back to the engine bay; the crew room is the big ring on the right; a leg slopes
// down from under the bar to the crew room floor. The propeller hangs under the engine.
const HULL_OUTLINE = [[-120, -60], [100, -60], [115, -45], [115, 45], [100, 60], [-10, 60], [-62, -20], [-120, -20]];
const CREW_ROOM = [[-5, -55], [98, -55], [110, -43], [110, 43], [98, 55], [-5, 55]]; // hollow interior
const CORRIDOR = [-115, -55, 110, 30];                 // hollow bar interior [x, y, w, h], engine bay at its left end
// Collision boxes [x, y, w, h]: top bar, crew room, sloped leg (axis-aligned, rotation is visual only)
const SUB_BOXES = [[-120, -60, 125, 40], [-10, -60, 125, 120], [-50, -20, 40, 60]];
// Walkable floors and the ladder between them
const FLOOR_TOP = -25, FLOOR_BOT = 52;                 // corridor floor, crew room floor (y of the figure's feet)
const CORRIDOR_X = [-112, 6], CREW_X = [2, 90];        // walkable x span of each floor
const LADDER_X = 4;
const HATCH_X = -74;                                   // engine bay hatch, in the corridor
const ENGINE_BOX = [-113, -54, 24, 28], ENGINE_USE_X = -82; // purple engine; stand left of USE_X to touch it
const PROP_POS = [-100, 6];                            // propeller hub, under the engine, outside
const STORAGE_BOX = [28, -55, 52, 9];                  // orange (nothing yet)
const PANEL_BOX = [100, -22, 9, 44];                   // green control panel on the front wall
const PUMP_BOX = [84, 32, 20, 18];                     // blue pump (nothing yet)
const CHAIR_X = 82;                                    // chair faces the control panel
// Red module slots. The sonar module sits in one and can be dragged between them.
const SLOTS = [
  { name: 'TOP',    box: [8, -60, 18, 5] },
  { name: 'CORNER', box: [102, -57, 10, 6] },
  { name: 'BOTTOM', box: [30, 55, 40, 5] },
  { name: 'LEG',    box: [-46, 14, 18, 6] },
];
const SONAR_START_SLOT = 2;                            // starts in the bottom slot
const RAIL_Y = 64, RAIL_X = [8, 90];                   // arm rail under the crew room
const MODULE_NAMES = { engine: 'ENGINE', propeller: 'PROPELLER', panel: 'CONTROL PANEL', sonar: 'SONAR',
                       arm: 'ARM', storage: 'STORAGE', pump: 'PUMP' };

// ===================== STATE =====================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const keys = {}, mouse = { x: 0, y: 0, down: false };
let sub, cam, dots, pings, echoes, pingTimer, time;
let relics, arm, coins;
let engine, term, alarmT, modules, sonarMod, hatch, wheel, drag;
let mode, standT, fig, shake, propAng;
let viewScale = 1; // current camera zoom, used by mouseWorld()

function reset() {
  sub = { x: START_X, y: START_Y, vx: 0, vy: 0, ang: 0, angV: 0, hp: MAX_HP, immune: 0, dead: false };
  cam = { x: START_X, y: START_Y };
  dots = []; pings = []; echoes = []; pingTimer = 0; time = 0;
  // Relic state: 'free' -> 'tying' (arm holding it) -> 'rising' (balloon on) -> 'gone' (banked)
  relics = RELIC_SPOTS.map(([x, y]) => ({ x, y, state: 'free' }));
  // Arm: baseX slides on the rail, ox/oy = claw offset from the base (kept so it can freeze or hang limp)
  arm = { baseX: 50, tipX: START_X, tipY: START_Y, ox: 0, oy: 40, held: null, tie: 0, hits: 0 };
  coins = 0;
  engine = { running: true, restart: 0, alarm: 0 }; // restart > 0 = restart in progress (seconds elapsed)
  term = { backup: 0, log: [] };                    // backup = seconds of terminal left after a power cut
  alarmT = 0;                                       // seconds of red alarm lights left
  modules = {};
  for (const k in MODULE_NAMES) modules[k] = { hp: MODULE_HP };
  sonarMod = { slot: SONAR_START_SLOT };
  hatch = { progress: 0 };                          // 0 = sealed, 1 = fully open
  wheel = { active: false, last: null };            // hatch wheel mini game
  drag = false;                                     // dragging the sonar module
  mode = 'seated'; standT = 0;                      // 'seated' | 'standingUp' | 'standing'
  fig = { x: CHAIR_X, y: FLOOR_BOT, ladder: false, vx: 0, stun: 0, walk: 0 }; // stick figure, interior px
  shake = 0; propAng = 0;
  log('SYSTEMS ONLINE', 'good');
}

// ===================== HELPERS =====================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ok = name => modules[name].hp > 0;                     // module not broken
const power = () => engine.running && ok('engine');
const terminalAlive = () => ok('panel') && (power() || term.backup > 0);
const armBroken = () => arm.hits >= ARM_MAX_HITS || !ok('arm');
const boxCenter = ([x, y, w, h]) => [x + w / 2, y + h / 2];
const sonarLocal = () => boxCenter(SLOTS[sonarMod.slot].box);

// The hull's drawn rotation: a fraction of the physics wobble so the interior stays readable
const visAng = () => sub.ang * SUB_VIS_TILT;
// Sub-local point -> world point, and back
function subPoint([lx, ly]) {
  const a = visAng(), c = Math.cos(a), s = Math.sin(a);
  return { x: sub.x + lx * c - ly * s, y: sub.y + lx * s + ly * c };
}
function toLocal(p) {
  const a = -visAng(), c = Math.cos(a), s = Math.sin(a), dx = p.x - sub.x, dy = p.y - sub.y;
  return { x: dx * c - dy * s, y: dx * s + dy * c };
}
// Collision boxes in world space
const subBoxes = () => SUB_BOXES.map(([x, y, w, h]) => ({ x: sub.x + x, y: sub.y + y, w, h }));
// Mouse position in world space (through the main camera)
const mouseWorld = () => ({ x: (mouse.x - cv.width / 2) / viewScale + cam.x,
                            y: (mouse.y - cv.height / 2) / viewScale + cam.y });

// Seated monitors: round sonar screen on the left, terminal on the right
function monitorLayout() {
  const W = cv.width, H = cv.height;
  // Leaves room at the top for the HUD/debug text
  const R = Math.min(H * 0.34, W * 0.24), tw = Math.min(W * 0.28, 360), gap = 40;
  const cx = (W - (2 * R + gap + tw)) / 2 + R, cy = H / 2 + 45;
  return { cx, cy, R, tx: cx + R + gap, ty: cy - R, tw, th: 2 * R };
}
// Mouse position in world space as read off the sonar screen (sonar is centered on the sub)
function sonarMouseWorld() {
  const L = monitorLayout(), k = MURK_RADIUS / L.R;
  return { x: sub.x + (mouse.x - L.cx) * k, y: sub.y + (mouse.y - L.cy) * k };
}
const wheelLayout = () => ({ cx: cv.width / 2, cy: cv.height / 2, R: Math.min(cv.width, cv.height) * 0.22 });

// ===================== AUDIO =====================
// Tiny square-wave beeps. The browser only allows audio after a click/keypress.
let actx = null;
function initAudio() { try { actx = actx || new AudioContext(); } catch (e) {} }
function beep(freq, dur, delay = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
  o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.04;
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}

// ===================== POWER + TERMINAL =====================
// Terminal log. sev: 'good' | 'warn' | 'bad'. Beeps only if the terminal is alive to show it.
function log(t, sev = 'warn') {
  term.log.push({ t, c: sev === 'good' ? '#4c8' : sev === 'bad' ? '#e44' : '#fa3' });
  if (term.log.length > 40) term.log.shift();
  if (time > 0 && terminalAlive()) beep(sev === 'bad' ? 300 : sev === 'good' ? 990 : 600, 0.07);
}
function cutPower(reason) {
  if (!engine.running) return;
  engine.running = false; engine.restart = 0; engine.alarm = 0;
  term.backup = TERMINAL_BACKUP_TIME; alarmT = ALARM_LIGHT_TIME;
  log(reason, 'bad'); log('POWER LOST - ON BACKUP', 'bad');
}
function updatePower(dt) {
  if (!power()) {
    term.backup = Math.max(0, term.backup - dt);       // terminal dies when backup runs out
    if (alarmT > 0) {                                  // alarm lights + beeps for a while
      alarmT -= dt;
      if ((engine.alarm -= dt) <= 0) { beep(300, 0.12); engine.alarm = ALARM_INTERVAL; }
    }
    // Restart in progress (started by touching the engine and pressing E)
    if (engine.restart > 0) {
      if (!ok('engine')) { engine.restart = 0; }
      else if ((engine.restart += dt) >= ENGINE_RESTART_TIME) {
        engine.running = true; engine.restart = 0; alarmT = 0; term.backup = 0;
        log('POWER RESTORED', 'good'); beep(660, 0.08); beep(990, 0.12, 0.1);
      }
    }
  }
  if (power() && ok('propeller')) propAng += PROP_SPIN * dt;
}

// ===================== DAMAGE =====================
// Every impact damages the carcass and the module nearest the impact point.
// While the arm is tying a relic it soaks the hit instead (no carcass or module damage).
// dirX = which way the impact throws things inside (-1 left, 1 right), used for the stumble.
function takeHit(amount, dirX, pt) {
  if (sub.immune > 0) return;
  sub.immune = IMMUNITY_TIME; // shared immunity, whoever takes the hit
  shake = SHAKE_TIME;
  // Standing figure gets thrown and loses control for a moment
  if (mode !== 'seated') {
    wheel.active = false;
    fig.stun = STUMBLE_TIME; fig.vx = (dirX || (Math.random() < 0.5 ? -1 : 1)) * STUMBLE_SPEED;
  }
  if (power() && Math.random() < ENGINE_STALL_CHANCE) cutPower('ENGINE STALLED');
  if (arm.held) {
    arm.hits++;
    log('ARM TOOK THE HIT', 'warn');
    if (armBroken()) { arm.held.state = 'free'; arm.held = null; log('ARM BROKEN', 'bad'); }
    return;
  }
  sub.hp = Math.max(0, sub.hp - amount);
  if (sub.hp === 0) { sub.dead = true; return; }
  damageNearestModule(pt);
  log(`IMPACT - HULL ${sub.hp}/${MAX_HP}`, sub.hp < 60 ? 'bad' : 'warn');
}
function damageNearestModule(pt) {
  if (!pt) return;
  const l = toLocal(pt);
  const pos = { engine: boxCenter(ENGINE_BOX), propeller: PROP_POS, storage: boxCenter(STORAGE_BOX),
                panel: boxCenter(PANEL_BOX), pump: boxCenter(PUMP_BOX), arm: [arm.baseX, RAIL_Y], sonar: sonarLocal() };
  let best = null, bd = Infinity;
  for (const k in pos) {
    const d = Math.hypot(pos[k][0] - l.x, pos[k][1] - l.y);
    if (d < bd) { bd = d; best = k; }
  }
  const m = modules[best];
  if (m.hp <= 0) return;
  m.hp--;
  if (m.hp > 0) { log(`${MODULE_NAMES[best]} DAMAGED`, 'warn'); return; }
  log(`${MODULE_NAMES[best]} BROKEN`, 'bad');
  if (best === 'engine') cutPower('ENGINE DESTROYED');
  if (best === 'arm' && arm.held) { arm.held.state = 'free'; arm.held = null; }
}

// ===================== INPUT =====================
addEventListener('keydown', e => {
  initAudio();
  if (!e.repeat) {
    if (e.code === 'KeyF') toggleSeat();
    if (e.code === 'KeyE') interact();
    if (e.code === 'Escape') wheel.active = false;
  }
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR' && sub.dead) reset();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; drag = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  initAudio();
  if (e.button !== 0) return;
  mouse.down = true;
  // Standing: grab the sonar module out of its slot
  if (mode === 'standing' && !wheel.active && !sub.dead) {
    const p = toLocal(mouseWorld()), [x, y, w, h] = SLOTS[sonarMod.slot].box;
    if (p.x > x - 4 && p.x < x + w + 4 && p.y > y - 4 && p.y < y + h + 4) drag = true;
  }
});
addEventListener('mouseup', e => {
  if (e.button !== 0) return;
  mouse.down = false;
  if (!drag) return;
  // Drop the sonar module into the nearest red slot (if close enough), otherwise it snaps back
  drag = false;
  const p = toLocal(mouseWorld());
  let best = -1, bd = 18;
  SLOTS.forEach((s, i) => { const [cx, cy] = boxCenter(s.box), d = Math.hypot(cx - p.x, cy - p.y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0 && best !== sonarMod.slot) { sonarMod.slot = best; log(`SONAR MOVED TO ${SLOTS[best].name} SLOT`, 'good'); }
});
cv.addEventListener('contextmenu', e => e.preventDefault());
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize);

// F: stand up from the chair, or sit back down (only next to the chair)
function toggleSeat() {
  if (sub.dead) return;
  if (wheel.active) { wheel.active = false; return; }
  if (mode === 'seated') { mode = 'standingUp'; standT = 0; Object.assign(fig, { x: CHAIR_X - 8, y: FLOOR_BOT, ladder: false, vx: 0, stun: 0 }); }
  else if (mode === 'standing' && !fig.ladder && fig.y === FLOOR_BOT && Math.abs(fig.x - CHAIR_X) < USE_RANGE + 4) mode = 'seated';
}
// What's within reach of the standing figure
function nearby() {
  if (mode !== 'standing' || fig.ladder || fig.stun > 0) return null;
  if (fig.y === FLOOR_TOP && fig.x < ENGINE_USE_X) return 'engine';
  if (fig.y === FLOOR_TOP && Math.abs(fig.x - HATCH_X) < 10) return 'hatch';
  if (fig.y === FLOOR_BOT && Math.abs(fig.x - CHAIR_X) < USE_RANGE + 4) return 'chair';
  return null;
}
// E while standing: touch the engine to start a restart, or grab the hatch wheel
function interact() {
  if (sub.dead || mode !== 'standing') return;
  if (wheel.active) { wheel.active = false; return; }
  const n = nearby();
  if (n === 'engine') {
    if (!ok('engine')) log('ENGINE DESTROYED - NO START', 'bad');
    else if (power()) log('ENGINE ALREADY RUNNING', 'good');
    else if (engine.restart === 0) { engine.restart = 0.001; log('ENGINE RESTART...', 'warn'); }
  } else if (n === 'hatch') { wheel.active = true; wheel.last = null; }
}

// ===================== PHYSICS =====================
const boxHit = (a, r) => a.x + a.w > r.x && a.x < r.x + r.w && a.y + a.h > r.y && a.y < r.y + r.h;

// Collision is axis-aligned (rotation is visual only). Move one axis, push the sub out by the
// deepest overlap of any of its 3 boxes, then bounce/damage once (so two boxes on one wall don't double up).
function collideAxis(axis) {
  const v = axis === 'x' ? 'vx' : 'vy', pos = axis, size = axis === 'x' ? 'w' : 'h';
  let push = 0, pt = null;
  for (const b of subBoxes()) for (const r of ROCKS) {
    if (!boxHit(b, r)) continue;
    const p = sub[v] > 0 ? r[pos] - (b[pos] + b[size]) : r[pos] + r[size] - b[pos];
    if (Math.abs(p) > Math.abs(push)) {
      push = p;
      // Contact point = center of the overlap, used to pick which module takes the damage
      pt = { x: (Math.max(b.x, r.x) + Math.min(b.x + b.w, r.x + r.w)) / 2,
             y: (Math.max(b.y, r.y) + Math.min(b.y + b.h, r.y + r.h)) / 2 };
    }
  }
  if (!push) return;
  const speed = Math.abs(sub[v]), dir = Math.sign(sub[v]);
  sub[pos] += push;
  sub[v] = -sub[v] * BOUNCE;          // bounce off the rock
  sub.angV += (Math.random() - 0.5) * speed * 0.03; // knock it into a spin
  if (speed > HIT_SPEED) takeHit(HIT_DAMAGE, axis === 'x' ? dir : 0, pt);
}

// Stick figure: walk A/D on a floor, W/S on the ladder, stumble on hits, closed hatch blocks the corridor
function updateFigure(dt) {
  if (mode === 'standingUp' && (standT += dt) >= STAND_UP_TIME) mode = 'standing';
  if (mode !== 'standing' || sub.dead) return;
  if (wheel.active) { updateWheel(); return; }
  const inBay = fig.x < HATCH_X;
  const h = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const v = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (fig.stun > 0) {                                  // stumbling: thrown along, no control
    fig.stun -= dt;
    if (!fig.ladder) { fig.x += fig.vx * dt; fig.vx *= Math.exp(-4 * dt); }
  } else if (fig.ladder) {
    fig.y = clamp(fig.y + v * CLIMB_SPEED * dt, FLOOR_TOP, FLOOR_BOT);
    if (h && (fig.y === FLOOR_TOP || fig.y === FLOOR_BOT)) fig.ladder = false; // step off at either end
  } else if (v && Math.abs(fig.x - LADDER_X) < 5) {
    fig.ladder = true; fig.x = LADDER_X;               // grab the ladder
  } else {
    fig.x += h * WALK_SPEED * dt; fig.walk += Math.abs(h) * dt;
  }
  if (fig.ladder) return;
  const [x0, x1] = fig.y === FLOOR_TOP ? CORRIDOR_X : CREW_X;
  fig.x = clamp(fig.x, x0, x1);
  if (fig.y === FLOOR_TOP && hatch.progress < HATCH_PASSABLE)
    fig.x = inBay ? Math.min(fig.x, HATCH_X - 3) : Math.max(fig.x, HATCH_X + 3);
}

// Hatch wheel mini game: hold the mouse and spin it around the wheel. Clockwise opens, counter-clockwise seals.
function updateWheel() {
  const L = wheelLayout();
  if (mouse.down) {
    const a = Math.atan2(mouse.y - L.cy, mouse.x - L.cx);
    if (wheel.last !== null) {
      const d = Math.atan2(Math.sin(a - wheel.last), Math.cos(a - wheel.last));
      const before = hatch.progress;
      hatch.progress = clamp(hatch.progress + d / (Math.PI * 2 * HATCH_TURNS), 0, 1);
      if (before < 1 && hatch.progress === 1) log('BAY HATCH OPEN', 'good');
      if (before > 0 && hatch.progress === 0) log('BAY HATCH SEALED', 'good');
    }
    wheel.last = a;
  } else wheel.last = null;
  // Walking away lets go of the wheel
  if (keys.KeyA || keys.KeyD || keys.KeyW || keys.KeyS || keys.ArrowLeft || keys.ArrowRight) wheel.active = false;
}

function update(dt) {
  time += dt;
  sub.immune -= dt;
  updatePower(dt);
  updateFigure(dt);
  // Only steer from the chair, with power, a working propeller and a working control panel
  const canSteer = !sub.dead && mode === 'seated' && power() && ok('propeller') && ok('panel');
  if (canSteer || (!sub.dead && SINK_ENABLED)) {
    // Thrust input (normalised so diagonals aren't faster)
    let ix = canSteer ? (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) : 0;
    let iy = canSteer ? (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) : 0;
    const len = Math.hypot(ix, iy) || 1;
    sub.vx += ix / len * THRUST * dt;
    // Sink: a constant push whose terminal speed under drag equals SINK_SPEED
    sub.vy += (iy / len * THRUST + (SINK_ENABLED ? SINK_SPEED * DRAG : 0)) * dt;
  }
  // Strong exponential drag = loose, floaty overshoot instead of instant stops
  const d = Math.exp(-DRAG * dt);
  sub.vx *= d; sub.vy *= d;

  sub.x += sub.vx * dt; collideAxis('x');
  sub.y += sub.vy * dt; collideAxis('y');
  touchCreature();
  updateArm(dt);

  // Rotation lag: a damped spring chasing a tilt based on horizontal speed
  const target = sub.vx * TILT_PER_SPEED;
  sub.angV += (target - sub.ang) * ROT_STIFFNESS * dt;
  sub.angV *= Math.exp(-ROT_DAMPING * dt);
  sub.ang += sub.angV * dt;

  // Camera eases toward the sub; zoom fits the sub on screen
  viewScale = Math.min(VIEW_ZOOM, cv.width * 0.8 / 240, cv.height * 0.7 / 130);
  const k = 1 - Math.exp(-6 * dt);
  cam.x += (sub.x - cam.x) * k; cam.y += (sub.y - cam.y) * k;
  shake = Math.max(0, shake - dt);

  updateSonar(dt);
  dots = dots.filter(p => time - p.t < p.fade);
}

// Creature contact: circle vs any of the sub's 3 boxes. Any touch hurts (shares hull immunity) and flings the sub away.
function touchCreature() {
  const cr = CREATURE_SIZE / 2;
  // Closest point on each box to the creature's center
  let pt = null;
  for (const b of subBoxes()) {
    const px = Math.max(b.x, Math.min(CREATURE_X, b.x + b.w));
    const py = Math.max(b.y, Math.min(CREATURE_Y, b.y + b.h));
    if (Math.hypot(px - CREATURE_X, py - CREATURE_Y) < cr) { pt = { x: px, y: py }; break; }
  }
  if (!pt) return;
  // Direction from creature to sub (fallback straight up if dead center)
  let dx = sub.x - CREATURE_X, dy = sub.y - CREATURE_Y;
  const d = Math.hypot(dx, dy);
  if (d === 0) { dx = 0; dy = -1; } else { dx /= d; dy /= d; }
  sub.vx = dx * CREATURE_KNOCKBACK; sub.vy = dy * CREATURE_KNOCKBACK;
  sub.angV += (Math.random() - 0.5) * 8;
  takeHit(CREATURE_DAMAGE, -Math.sign(dx), pt); // inside, things lurch toward the creature
}

// ===================== ARM + LOOT =====================
// The arm's base slides along a rail under the crew room. Hold E while seated to steer it with the
// mouse on the sonar screen. Without power it hangs limp; powered but idle it freezes in place.
function updateArm(dt) {
  const working = !armBroken() && power() && ok('panel');
  let base = subPoint([arm.baseX, RAIL_Y]);
  if (arm.held) {
    // Claw stays clamped on the relic while tying; drifting out of reach or losing power cancels it
    arm.tipX = arm.held.x; arm.tipY = arm.held.y;
    arm.ox = arm.tipX - base.x; arm.oy = arm.tipY - base.y;
    if (Math.hypot(arm.ox, arm.oy) > ARM_REACH || !working) {
      arm.held.state = 'free'; arm.held = null;
    } else if ((arm.tie += dt) >= TIE_TIME) {
      arm.held.state = 'rising'; arm.held = null; // balloon on, let go
    }
    return updateBalloons(dt);
  }
  if (mode === 'seated' && keys.KeyE && working && !sub.dead) {
    // Slide the base toward the target's x along the rail, then reach toward it
    const m = sonarMouseWorld(), lx = clamp(toLocal(m).x, RAIL_X[0], RAIL_X[1]);
    arm.baseX += clamp(lx - arm.baseX, -ARM_SLIDE_SPEED * dt, ARM_SLIDE_SPEED * dt);
    base = subPoint([arm.baseX, RAIL_Y]);
    const dx = m.x - base.x, dy = m.y - base.y, d = Math.hypot(dx, dy) || 1, reach = Math.min(d, ARM_REACH);
    arm.ox = dx / d * reach; arm.oy = dy / d * reach;
    arm.tipX = base.x + arm.ox; arm.tipY = base.y + arm.oy;
    // Auto-grab: claw overlapping a free relic starts the tie
    const h = RELIC_SIZE / 2 + CLAW_RADIUS;
    const r = relics.find(r => r.state === 'free' && Math.abs(r.x - arm.tipX) < h && Math.abs(r.y - arm.tipY) < h);
    if (r) { r.state = 'tying'; arm.held = r; arm.tie = 0; }
  } else if (!power() || armBroken()) {
    // Limp: sags down
    const k = 1 - Math.exp(-3 * dt);
    arm.ox += (0 - arm.ox) * k; arm.oy += (ARM_REACH * 0.6 - arm.oy) * k;
  }
  arm.tipX = base.x + arm.ox; arm.tipY = base.y + arm.oy;

}
// Ballooned relics rise straight up through everything; bank coins at the top of the cave
function updateBalloons(dt) {
  for (const r of relics) {
    if (r.state !== 'rising') continue;
    r.y -= BALLOON_SPEED * dt;
    if (r.y < -50) { r.state = 'gone'; coins += RELIC_VALUE; }
  }
}

// ===================== SONAR =====================
// Ray vs rectangle (slab method). Returns distance along ray or Infinity.
function rayRect(ox, oy, dx, dy, r) {
  let tmin = 0, tmax = MURK_RADIUS;
  for (const [o, dd, lo, hi] of [[ox, dx, r.x, r.x + r.w], [oy, dy, r.y, r.y + r.h]]) {
    if (Math.abs(dd) < 1e-9) { if (o < lo || o > hi) return Infinity; continue; }
    let t1 = (lo - o) / dd, t2 = (hi - o) / dd;
    if (t1 > t2) [t1, t2] = [t2, t1];
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
// Ray vs the creature's circle. Returns distance along ray or Infinity.
function rayCreature(ox, oy, dx, dy) {
  const fx = ox - CREATURE_X, fy = oy - CREATURE_Y, r = CREATURE_SIZE / 2;
  const b = fx * dx + fy * dy, c = fx * fx + fy * fy - r * r, disc = b * b - c;
  if (disc < 0) return Infinity;
  const t = -b - Math.sqrt(disc);
  return t >= 0 ? t : Infinity;
}
function castRay(o, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let best = Infinity;
  for (const r of ROCKS) best = Math.min(best, rayRect(o.x, o.y, dx, dy, r));
  const tc = rayCreature(o.x, o.y, dx, dy);
  const creature = tc < best; // creature is in front of any rock on this ray
  best = Math.min(best, tc);
  // Relics are small boxes; any not yet banked can be pinged
  let tr = Infinity;
  for (const r of relics) {
    if (r.state === 'gone') continue;
    const s = RELIC_SIZE;
    tr = Math.min(tr, rayRect(o.x, o.y, dx, dy, { x: r.x - s / 2, y: r.y - s / 2, w: s, h: s }));
  }
  const relic = tr < best;
  best = Math.min(best, tr);
  return { dist: Math.min(best, MURK_RADIUS), hit: best <= MURK_RADIUS, creature: creature && !relic, relic, dx, dy };
}
// A ping is a cone of rays fired from the sonar module (in whichever red slot it sits). Its wavefront grows at SOUND_SPEED.
// The world is static, so each ray's hit distance is computed up front; the wave just "reveals" it over time.
// When the wavefront reaches a hit, an echo spawns there and flies back to the module (wherever it is now).
// The dot only appears when the echo arrives, so far walls show up late and moving fast outruns your info.
function firePing() {
  const o = subPoint(sonarLocal()), m = sonarMouseWorld();
  const aim = Math.atan2(m.y - o.y, m.x - o.x);
  const rays = [], stepA = PING_SPREAD / (PING_RAYS - 1);
  const jitter = (Math.random() - 0.5) * stepA; // shift each ping a bit so repeats fill gaps
  for (let i = 0; i < PING_RAYS; i++) {
    const r = castRay(o, aim - PING_SPREAD / 2 + stepA * i + jitter);
    rays.push({ ...r, echoed: !r.hit }); // misses never echo
  }
  // Static: a few fake returns at random spots inside the cone, released when the wave gets there
  const noise = [];
  for (let i = 0; i < SONAR_NOISE; i++) {
    const a = aim + (Math.random() - 0.5) * PING_SPREAD;
    noise.push({ dx: Math.cos(a), dy: Math.sin(a), dist: Math.random() * MURK_RADIUS, echoed: false });
  }
  pings.push({ x: o.x, y: o.y, t: time, rays, noise });
}

// Turn a true hit into what the bad hardware reports: maybe nothing, otherwise a smeared, dimmer point.
function spawnEcho(p, r) {
  const f = r.dist / MURK_RADIUS;                      // 0 near, 1 at the murk edge
  if (Math.random() < SONAR_DROPOUT * f) return;       // lost in the murk
  const err = r.dist * SONAR_JITTER;
  const hx = p.x + r.dx * r.dist + (Math.random() - 0.5) * 2 * err;
  const hy = p.y + r.dy * r.dist + (Math.random() - 0.5) * 2 * err;
  echoes.push({ x: hx, y: hy, hx, hy, creature: r.creature, relic: r.relic, bright: 1 - SONAR_DIST_FADE * f });
}

const sonarWorks = () => power() && ok('panel') && ok('sonar');
function updateSonar(dt) {
  pingTimer -= dt;
  // Pinging needs the chair, power, the panel and the sonar module
  if (mouse.down && !sub.dead && mode === 'seated' && sonarWorks() && pingTimer <= 0) { firePing(); pingTimer = PING_COOLDOWN; }

  // Grow wavefronts, spawn echoes where they touch rock
  for (const p of pings) {
    const rad = (time - p.t) * SOUND_SPEED;
    for (const r of p.rays.concat(p.noise)) {
      if (!r.echoed && rad >= r.dist) { r.echoed = true; spawnEcho(p, r); }
    }
  }
  pings = pings.filter(p => (time - p.t) * SOUND_SPEED < MURK_RADIUS);

  // Echoes home in on the sonar module; on arrival the hit point becomes a dot
  const em = subPoint(sonarLocal());
  for (const e of echoes) {
    const dx = em.x - e.x, dy = em.y - e.y, d = Math.hypot(dx, dy);
    const step = SOUND_SPEED * dt;
    if (d <= Math.max(step, 12)) {

      // Snap to the coarse display grid
      dots.push({ x: Math.round(e.hx / SONAR_GRID) * SONAR_GRID, y: Math.round(e.hy / SONAR_GRID) * SONAR_GRID,
                  t: time, creature: e.creature, relic: e.relic, bright: e.bright,
                  fade: e.creature ? CREATURE_DOT_FADE : DOT_FADE_TIME });
    }
    else { e.x += dx / d * step; e.y += dy / d * step; }
  }
  echoes = echoes.filter(e => !e.done);
}

  ctx.fillStyle = '#26292e'; ctx.beginPath(); ctx.arc(cx, cy, R + 16, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#6a7'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 36; i++) { const a = i * Math.PI / 18, l = i % 9 ? 5 : 10; ctx.moveTo(cx + Math.cos(a) * (R + 2), cy + Math.sin(a) * (R + 2)); ctx.lineTo(cx + Math.cos(a) * (R + 2 + l), cy + Math.sin(a) * (R + 2 + l)); }
  ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#010c06'; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  ctx.textAlign = 'center'; ctx.font = 'bold 16px monospace';
  if (!ok('panel')) { staticNoise(cx - R, cy - R, 2 * R, 2 * R); ctx.fillStyle = '#e44'; ctx.fillText('PANEL DAMAGED', cx, cy); }
  else if (!power()) { ctx.fillStyle = alarmOn() ? '#a22' : '#411'; ctx.fillText('NO POWER', cx, cy); }
  else {
    // Range rings + crosshair
    ctx.strokeStyle = '#0c3a20'; ctx.lineWidth = 1; ctx.beginPath();
    for (const f of [1 / 3, 2 / 3]) { ctx.moveTo(cx + R * f, cy); ctx.arc(cx, cy, R * f, 0, Math.PI * 2); }
    ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    // Dots: chunky blocks, dimmer the further they came from, fading with age, blooming when fresh
    const g = Math.max(2, SONAR_GRID * k);
    for (const p of dots) {
      const age = time - p.t, [x, y] = S(p.x, p.y), s = age < 0.2 ? g * 1.6 : g;
      ctx.fillStyle = p.creature ? '#f63' : p.relic ? RELIC_COLOR : SONAR_COLOR;
      ctx.globalAlpha = p.bright * (1 - age / p.fade);
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    // Outgoing wavefronts (flickery), returning echo specks
    ctx.strokeStyle = SONAR_COLOR; ctx.lineWidth = 1.5;
    for (const p of pings) {
      const rad = (time - p.t) * SOUND_SPEED;
      ctx.globalAlpha = 0.7 * (1 - 0.5 * rad / MURK_RADIUS);
      ctx.beginPath();
      for (let i = 0; i < p.rays.length - 1; i++) {
        const a = p.rays[i], b = p.rays[i + 1];
        if (rad > a.dist || rad > b.dist || Math.random() < SONAR_FLICKER) continue;
        ctx.moveTo(...S(p.x + a.dx * rad, p.y + a.dy * rad)); ctx.lineTo(...S(p.x + b.dx * rad, p.y + b.dy * rad));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.5; ctx.fillStyle = SONAR_COLOR;
    for (const ec of echoes) { const [x, y] = S(ec.x, ec.y); ctx.fillRect(x - 1, y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    // Own sub outline, arm and balloons
    ctx.strokeStyle = '#3c9'; ctx.lineWidth = 1;
    ctx.beginPath(); HULL_OUTLINE.forEach((p, i) => { const w = subPoint(p), [x, y] = S(w.x, w.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke();
    const em = subPoint(sonarLocal()), [ex, ey] = S(em.x, em.y);
    ctx.fillStyle = '#9fc'; ctx.fillRect(ex - 2, ey - 2, 4, 4);
    drawArm(S, k, 2); drawBalloons(S, k);
    if (!ok('sonar')) { ctx.fillStyle = '#e44'; ctx.fillText('SONAR MODULE OFFLINE', cx, cy - R * 0.5); }
    // Faint screen noise
    for (let i = 0; i < 25; i++) { ctx.fillStyle = 'rgba(80,255,150,0.15)'; ctx.fillRect(cx - R + Math.random() * 2 * R, cy - R + Math.random() * 2 * R, 2, 2); }
  }
  ctx.restore();
  ctx.fillStyle = '#9ab'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('LMB: PING    HOLD E: ARM    F: STAND UP', cx, cy + R + 36);
}
// Terminal monitor: status, module health, message log. Dies 7s after a power cut.
function drawTerminal(L) {
  const { tx: x, ty: y, tw: w, th: h } = L;
  ctx.fillStyle = '#26292e'; ctx.fillRect(x - 12, y - 12, w + 24, h + 24);
  ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 2; ctx.strokeRect(x - 12, y - 12, w + 24, h + 24);
  ctx.fillStyle = '#020a05'; ctx.fillRect(x, y, w, h);
  if (!ok('panel')) { staticNoise(x, y, w, h); return; }
  if (!terminalAlive()) return; // dead black screen
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.textAlign = 'left'; ctx.font = '12px monospace';
  let ly = y + 20;
  const line = (t, c) => { ctx.fillStyle = c; ctx.fillText(t, x + 10, ly); ly += 16; };
  line('ENGINE TERMINAL', '#5f9');
  if (power()) line('POWER: ONLINE', '#4c8');
  else {
    line('POWER: OFFLINE', Math.floor(time * 3) % 2 ? '#e44' : '#822');
    line(`BACKUP: ${term.backup.toFixed(1)}s`, '#fa3');
    if (engine.restart > 0) line(`RESTART ${Math.floor(100 * engine.restart / ENGINE_RESTART_TIME)}%`, '#fa3');
  }
  line(`HULL: ${sub.hp}/${MAX_HP}`, sub.hp < 60 ? '#e44' : '#4c8');
  // Module health bars
  for (const k in modules) {
    const hp = k === 'arm' && armBroken() ? 0 : modules[k].hp;
    line(`${MODULE_NAMES[k].padEnd(13)} ${'#'.repeat(hp)}${'.'.repeat(MODULE_HP - hp)}`, hp === MODULE_HP ? '#4c8' : hp > 0 ? '#fa3' : '#e44');
  }
  ly += 6; line('-- LOG --', '#5f9');
  const room = Math.floor((y + h - ly) / 16);
  for (const m of term.log.slice(-room)) line('> ' + m.t, m.c);
  ctx.restore();
}
// Hatch wheel overlay: big valve wheel you spin with the mouse
function drawWheel() {
  const { cx, cy, R } = wheelLayout(), a = hatch.progress * HATCH_TURNS * Math.PI * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
  ctx.strokeStyle = '#d93'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 8; ctx.beginPath();
  for (let i = 0; i < 3; i++) { const s = i * Math.PI / 1.5; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(s) * R, Math.sin(s) * R); }
  ctx.stroke(); ctx.fillStyle = '#d93'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#222'; ctx.fillRect(cx - R, cy + R + 30, 2 * R, 10);
  ctx.fillStyle = '#d93'; ctx.fillRect(cx - R, cy + R + 30, 2 * R * hatch.progress, 10);
  ctx.textAlign = 'center'; ctx.font = '14px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(`HATCH ${Math.round(hatch.progress * 100)}% OPEN`, cx, cy - R - 40);
  ctx.font = '12px monospace'; ctx.fillStyle = '#aaa';
  ctx.fillText('hold LMB and spin: clockwise opens, counter-clockwise seals   (E / move to let go)', cx, cy + R + 64);
}

// ===================== RENDER =====================
function draw() {
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#04101f'; ctx.fillRect(0, 0, W, H);
  // Main camera: zoomed on the sub. The outside world is invisible (sonar only), but your own arm and balloons show.
  const sk = SHAKE_AMOUNT * (shake / SHAKE_TIME);
  ctx.save();
  ctx.translate(W / 2 + (Math.random() - 0.5) * 2 * sk, H / 2 + (Math.random() - 0.5) * 2 * sk);
  ctx.scale(viewScale, viewScale);
  ctx.translate(-cam.x, -cam.y);
  const I = (x, y) => [x, y]; // world coords as-is
  drawBalloons(I, 1);
  drawArm(I, 1, 2 / viewScale);
  drawSub();
  ctx.restore();

  // Red alarm glow around the screen edges while the lights blink
  if (alarmOn()) {
    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    gr.addColorStop(0, 'rgba(255,0,0,0)'); gr.addColorStop(1, 'rgba(255,0,0,0.45)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  // Seated: the two monitors pop up over a darkened view
  if (mode === 'seated' && !sub.dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    const L = monitorLayout();
    drawSonarScreen(L); drawTerminal(L);
  }
  if (wheel.active) drawWheel();

  // Hull bar (carcass)
  ctx.fillStyle = '#222'; ctx.fillRect(16, 16, 200, 14);
  ctx.fillStyle = sub.hp > 60 ? '#4c8' : '#e44'; ctx.fillRect(16, 16, 200 * sub.hp / MAX_HP, 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(16.5, 16.5, 200, 14);
  ctx.font = '10px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#000'; ctx.fillText('HULL', 20, 27);

  // Coins + arm status under the hull bar
  ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = RELIC_COLOR; ctx.fillText(`COINS ${coins}`, 16, 50);
  const armHit = arm.hits > 0 || modules.arm.hp < MODULE_HP;
  ctx.fillStyle = armBroken() ? '#e44' : armHit ? '#fa3' : '#4c8';
  ctx.fillText(armBroken() ? 'ARM BROKEN' : armHit ? 'ARM HIT' : 'ARM OK', 16, 68);

  // Debug readout
  ctx.font = '13px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#9cf';
  const dbg = [`HP ${sub.hp}`, `SPD ${Math.hypot(sub.vx, sub.vy).toFixed(0)} px/s`, `DEPTH ${(sub.y / 10).toFixed(1)} m`,
    `CREATURE ${(Math.hypot(sub.x - CREATURE_X, sub.y - CREATURE_Y) / 10).toFixed(1)} m`, `MODE ${mode}`,
    `FIG ${fig.x.toFixed(0)},${fig.y.toFixed(0)}${fig.ladder ? ' ladder' : ''}`,
    `MOD ${Object.keys(modules).map(k => k[0].toUpperCase() + modules[k].hp).join(' ')}`];
  dbg.forEach((t, i) => ctx.fillText(t, W - 16, 24 + i * 18));

  // Mode + context hint, top center
  ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace';
  ctx.fillStyle = mode === 'seated' ? '#9cf' : '#fc6';
  ctx.fillText(mode === 'seated' ? 'SEATED' : 'STANDING', W / 2, 24);
  if (mode === 'standing' && !wheel.active) {
    const n = nearby();
    const hint = n === 'engine' ? (power() ? 'ENGINE RUNNING' : 'E: RESTART ENGINE') : n === 'hatch' ? 'E: HATCH WHEEL'
      : n === 'chair' ? 'F: SIT' : fig.ladder ? 'W/S: CLIMB' : 'A/D: WALK   W/S at ladder   drag the sonar module between red slots';
    ctx.font = '12px monospace'; ctx.fillStyle = '#ccc'; ctx.fillText(hint, W / 2, 42);
  }

  if (sub.dead) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#f44'; ctx.font = 'bold 48px monospace';
    ctx.fillText('HULL IMPLODED', W / 2, H / 2);
    ctx.font = '16px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('press R to restart', W / 2, H / 2 + 34);
  }
}
// ===================== LOOP =====================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); // clamp so tab-switches don't teleport us
  last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
resize(); reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
