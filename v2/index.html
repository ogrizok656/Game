const HULL_FREE_FRACTION = 0.51; // free hull repair between dives only goes up to this

// Sonar
const DOT_FADE_TIME = 6.0;
const MURK_RADIUS   = 380;   // px, hard cutoff: murky water kills the ping here

// ===================== WORLD: THE TRENCH =====================
// One fixed level. Built from a seeded random so it's identical every run (hand-shaped, just not hand-typed).
// A wide mouth narrows into a tight throat where the creature waits, then opens into the Atlantis cavern.
// Everything solid is a polygon: { pts, kind ('rock' | 'ruin'), bbox x0..x1 / y0..y1, segs (edges + tangents) }.
// The old fixed trench is a hidden test level: add #trench to the URL. The real game is the procedural run below.
const TEST_TRENCH = /trench/.test(location.hash);
let LV = null;          // the procedural level, once built (null = the trench)
let seed = 20261027;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const LEVEL_W = 2000, LEVEL_BOTTOM = 5900;
const CAVERN_FLOOR = 5440;     // top of the Atlantis cavern floor
const THROAT_Y = 3350;         // narrowest part, where the creature waits
const trenchCenter = y => 1000 + 150 * Math.sin(y / 850) + 60 * Math.sin(y / 310 + 1);
// Half width of open water at each depth, smoothly blended between these keys
const WIDTH_KEYS = [[-400, 900], [300, 700], [1400, 400], [2400, 340], [3000, 320], [3600, 310], [4050, 450], [4500, 900], [LEVEL_BOTTOM, 950]];
function trenchHalfWidth(y) {
  for (let i = 1; i < WIDTH_KEYS.length; i++) {
    const [y0, w0] = WIDTH_KEYS[i - 1], [y1, w1] = WIDTH_KEYS[i];
    if (y <= y1) { const f = Math.max(0, Math.min(1, (y - y0) / (y1 - y0))), s = f * f * (3 - 2 * f); return w0 + (w1 - w0) * s; }
  }
  return WIDTH_KEYS[WIDTH_KEYS.length - 1][1];
}
// Jagged wall faces: smooth wander + random chips every WALL_STEP px
const WALL_STEP = 45, wallL = [], wallR = [];
for (let y = -400; y <= LEVEL_BOTTOM; y += WALL_STEP) {
  const c = trenchCenter(y), hw = trenchHalfWidth(y), jag = () => (srand() - 0.5) * 44;
  wallL.push([c - hw + 32 * Math.sin(y / 97) + 18 * Math.sin(y / 37 + 2) + jag(), y]);
  wallR.push([c + hw + 32 * Math.sin(y / 113 + 1) + 18 * Math.sin(y / 43) + jag(), y]);
}
// x of a wall face at depth y (side -1 = left, 1 = right)
function wallX(side, y) {
  const a = side < 0 ? wallL : wallR, i = Math.max(0, Math.min(a.length - 2, Math.floor((y + 400) / WALL_STEP)));
  return a[i][0] + (a[i + 1][0] - a[i][0]) * (y - a[i][1]) / WALL_STEP;
}
const SOLIDS = [];
function addSolid(pts, kind = 'rock') {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), segs = [];
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], l = Math.hypot(bx - ax, by - ay) || 1;
    segs.push({ ax, ay, bx, by, tx: (bx - ax) / l, ty: (by - ay) / l });
  }
  SOLIDS.push({ pts, kind, segs, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) });
}
const box = (x, y, w, h, kind = 'ruin') => addSolid([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], kind);
// The two walls (everything outside the faces is rock)
addSolid([[-600, -400], ...wallL, [-600, LEVEL_BOTTOM]]);
addSolid([[LEVEL_W + 600, -400], ...wallR, [LEVEL_W + 600, LEVEL_BOTTOM]]);
// Cavern floor: bumpy, rising toward the walls like a bowl
{
  const pts = [];
  for (let x = -100; x <= LEVEL_W + 200; x += 70) {
    const edge = Math.max(0, Math.abs(x - trenchCenter(5400)) - 650);
    pts.push([x, CAVERN_FLOOR + 28 * Math.sin(x / 130) + 14 * Math.sin(x / 47) + (srand() - 0.5) * 18 - edge * 0.45]);
  }
  addSolid([...pts, [LEVEL_W + 200, LEVEL_BOTTOM + 100], [-100, LEVEL_BOTTOM + 100]]);
}
// Overhanging ledges sticking out of a wall, sloping down. Returns a spot on top (for loot).
function ledge(side, y, len) {
  const wx = wallX(side, y), d = -side;
  addSolid([[wx - d * 40, y - 25], [wx + d * len, y + 5], [wx + d * len * 0.7, y + 22], [wx + d * len * 0.3, y + 36], [wx - d * 40, y + 50]]);
  return [wx + d * len * 0.5, y - 30];
}
// Lumpy floating boulders. Returns a spot on top.
function boulder(x, y, r) {
  const pts = [];
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = r * (0.75 + srand() * 0.4); pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8]); }
  addSolid(pts);
  return [x, y - r - 10];
}
const LEDGES = [ledge(-1, 800, 230), ledge(1, 1250, 200), ledge(-1, 1950, 150), ledge(1, 2600, 130), ledge(-1, 4250, 240), ledge(1, 4380, 220)];
const BOULDERS = [boulder(trenchCenter(450) + 270, 450, 80), boulder(trenchCenter(1600) - 130, 1600, 60),
                  boulder(trenchCenter(4800) + 420, 4800, 90), boulder(trenchCenter(4950) - 480, 4950, 70)];

// ----- Atlantis: ruins on the cavern floor (kind 'ruin' = pale returns on sonar) -----
const RX = Math.round(trenchCenter(5300)), F = CAVERN_FLOOR;
// Stepped temple with columns, roof and pediment (one column snapped short)
box(RX - 180, F - 60, 360, 140); box(RX - 140, F - 110, 280, 60); box(RX - 100, F - 155, 200, 50);
for (const [cx, h] of [[RX - 85, 150], [RX - 40, 150], [RX + 22, 85], [RX + 67, 150]]) box(cx - 9, F - 155 - h, 18, h);
box(RX - 105, F - 327, 125, 22); box(RX + 50, F - 327, 55, 22);             // roof slab, broken where the column fell
addSolid([[RX - 110, F - 327], [RX - 20, F - 382], [RX + 20, F - 372], [RX - 10, F - 327]], 'ruin');  // pediment fragment
// Colonnade on the left: broken columns, one slab still on top
for (const [cx, h] of [[RX - 600, 230], [RX - 520, 230], [RX - 440, 150], [RX - 360, 200]]) box(cx - 11, F - h, 22, h + 40);
box(RX - 612, F - 248, 112, 18);

for (let i = 0; i < 6; i++) {
  const a0 = Math.PI + i / 6 * Math.PI, a1 = Math.PI + (i + 1) / 6 * Math.PI, c = [RX + 420, F - 200];
  addSolid([[c[0] + Math.cos(a0) * 80, c[1] + Math.sin(a0) * 80], [c[0] + Math.cos(a1) * 80, c[1] + Math.sin(a1) * 80],
            [c[0] + Math.cos(a1) * 40, c[1] + Math.sin(a1) * 40], [c[0] + Math.cos(a0) * 40, c[1] + Math.sin(a0) * 40]], 'ruin');
}
// Domed building, far right
box(RX + 580, F - 140, 220, 180);
{ const pts = []; for (let i = 0; i <= 16; i++) { const a = Math.PI + i / 16 * Math.PI; pts.push([RX + 690 + Math.cos(a) * 105, F - 140 + Math.sin(a) * 105]); } addSolid(pts, 'ruin'); }
// Tower with crenellations, far left
box(RX - 800, F - 420, 80, 460);
for (let i = 0; i < 3; i++) box(RX - 800 + i * 31, F - 445, 18, 26);
// Fallen column and a jagged wall fragment
{
  const c = [RX - 240, F - 18], a = 0.18, hl = 85, hw = 12, ca = Math.cos(a), sa = Math.sin(a);
  addSolid([[-hl, -hw], [hl, -hw], [hl, hw], [-hl, hw]].map(([x, y]) => [c[0] + x * ca - y * sa, c[1] + x * sa + y * ca]), 'ruin');
}
addSolid([[RX + 200, F + 40], [RX + 200, F - 80], [RX + 230, F - 100], [RX + 260, F - 70], [RX + 290, F - 115], [RX + 310, F - 60], [RX + 310, F + 40]], 'ruin');

// ----- Placing things -----
const solidAt = (x, y) => LV ? caveSolidAt(x, y) : trenchSolidAt(x, y);
function trenchSolidAt(x, y) {
  for (const s of SOLIDS) if (x > s.x0 && x < s.x1 && y > s.y0 && y < s.y1 && inPoly({ x, y }, s.pts)) return true;
  return false;
}
// Drop a loot spot onto whatever surface is below it (rising out first if it starts inside something)
function settle([x, y], half) {
  for (let i = 0; i < 200 && solidAt(x, y + half); i++) y -= 4;
  for (let d = 0; d < 500; d += 2) if (solidAt(x, y + half + d + 1)) return [x, y + d];
  return [x, y];
}
const DOCK_X = Math.round(trenchCenter(100)), DOCK_Y = 100;
// The creature hugs the left wall of the throat: you have to squeeze past it to reach Atlantis
let CREATURE_HOME = [wallX(-1, THROAT_Y) + 75, THROAT_Y];
while ([0, 1, 2, 3, 4, 5, 6, 7].some(i => solidAt(CREATURE_HOME[0] + Math.cos(i * Math.PI / 4) * 40, CREATURE_HOME[1] + Math.sin(i * Math.PI / 4) * 40))) CREATURE_HOME[0] += 5;
// Loot. Deeper = richer: ruins relics are worth the most.
const RELIC_BAIT = [[CREATURE_HOME[0] + 95, THROAT_Y - 70], [CREATURE_HOME[0] + 40, THROAT_Y + 105]];   // floating by the creature
const RELIC_UPPER = [...LEDGES.slice(0, 4), ...BOULDERS.slice(0, 2)].map(p => settle(p, RELIC_SIZE / 2));
const RELIC_RUINS = [[RX - 20, F - 200], [RX - 160, F - 130], [RX - 560, F - 100], [RX + 420, F - 60], [RX + 690, F - 300],
                     [RX - 760, F - 480], [RX - 240, F - 80], [RX + 255, F - 160], [RX + 860, F - 80], [RX - 900, F - 60]]
                     .map(p => settle(p, RELIC_SIZE / 2));
const SCRAP_POOL = [...LEDGES.slice(4).map(p => settle(p, SCRAP_SIZE / 2)), ...BOULDERS.slice(2).map(p => settle(p, SCRAP_SIZE / 2)),
                    [wallX(-1, 1100) + 45, 1100], [wallX(1, 2200) - 45, 2200], [wallX(-1, 2900) + 45, 2900], [wallX(1, 3900) - 45, 3900],
                    ...[[RX - 450, F - 50], [RX + 120, F - 40], [RX + 560, F - 40], [RX - 700, F - 40]].map(p => settle(p, SCRAP_SIZE / 2))];

// ===================== SUB LAYOUT =====================

// ===================== TERMINAL LOG =====================

// ===================== POWER + AIR =====================

// ===================== WATER =====================

  if (LV) {
    const pi = run.near, sg = segAt(pi), next = LV.checkpoints[run.reached], toS = next ? next.s : LV.length;
    rows.unshift(`SEED ${runSeed}   SEGMENT ${LV.pts[pi].seg}/${LV.segs.length - 1} ${SEG_NAMES[sg.type]}   ${next ? 'NEXT CHECKPOINT ' + (run.reached + 1) : 'ATLANTIS'} ${Math.max(0, (toS - LV.pts[pi].s) / 10).toFixed(0)} m along the path   reached ${run.reached}/${LV.checkpoints.length}${LV.fixes ? '   path fixes ' + LV.fixes : ''}`);
  } else rows.unshift('TEST TRENCH (#trench)');
  const x = 16, y = 200;
  ctx.save(); ctx.font = '11px monospace'; ctx.textAlign = 'left';
  rect([x - 6, y - 14, Math.max(560, ...rows.map(r => ctx.measureText(r).width + 12)), rows.length * 15 + 10], 'rgba(0,0,0,0.75)', '#355');
  rows.forEach((r, i) => { ctx.fillStyle = '#9fd'; ctx.fillText(r, x, y + i * 15); });
  // The open close-up: the exact state object it's drawing from
  if (fix && fix.panel) {
    const S = closeupState(fix.panel), fmt = v => typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(3)) : typeof v === 'object' && v ? JSON.stringify(v) : String(v);
    const lines = [`CLOSE-UP ${fix.panel} READS:`, ...Object.entries(S).map(([k, v]) => `  ${k}: ${fmt(v)}`),
                   `  repair job: ${fix.job ? `${fix.job.kind} ${fix.job.item} x${fix.job.cost} (${fix.job.game})` : 'none'}   hold: ${fix.ha ? fix.ha.label : 'none'}`];
    const lx = cv.width - 330, ly = 200;
    rect([lx - 6, ly - 14, 322, lines.length * 14 + 10], 'rgba(0,0,0,0.75)', '#355');
    lines.forEach((t, i) => { ctx.fillStyle = i ? '#9fd' : '#ffb040'; ctx.fillText(t, lx, ly + i * 14); });
  }
  ctx.restore();
}
const DEATH_HINTS = {
  'SUFFOCATED': 'the air generator needs power and a slot; the crank and venting a horn charge buy you time',
  'FLOODED': 'run the pump early, and keep the bay door shut after a malfunction until the pump is going',
  'HULL IMPLODED': 'slow down near walls',
};

// ===================== RENDER =====================
function bar(x, y, w, f, c, t) {
  ctx.fillStyle = '#222'; ctx.fillRect(x, y, w, 10);
  ctx.fillStyle = c; ctx.fillRect(x, y, w * clamp(f, 0, 1), 10);
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w, 10);
  ctx.fillStyle = '#ddd'; ctx.font = '11px monospace'; ctx.textAlign = 'left'; ctx.fillText(t, x + w + 6, y + 9);
}
function draw() {
  const W = cv.width, H = cv.height, e = zoomEase();
  const monitorsOnly = mode === 'seated' && zoomT === 0 && !sub.dead;   // monitors cover the view: skip the scene
  ctx.fillStyle = monitorsOnly ? '#020509' : '#04101f'; ctx.fillRect(0, 0, W, H);
  if (!monitorsOnly) drawScene(W, H, e);
  drawOverlays(W, H);
  if (title) drawTitle();
  else if (keys.Tab) { ctx.fillStyle = 'rgba(1,4,8,0.85)'; ctx.fillRect(0, 0, W, H); drawControls(Math.max(60, H / 2 - 100)); }
}
function drawScene(W, H, e) {
  const sk = shakeAmp * (shake / SHAKE_TIME) * (1 + 1.5 * e);
  ctx.save();
  ctx.translate(W / 2 + (Math.random() - 0.5 + shakeBias * 0.4) * 2 * sk, H / 2 + (Math.random() - 0.5) * 2 * sk);
  ctx.scale(viewScale, viewScale);
  ctx.translate(-cam.x, -cam.y);
  const M = ctx.getTransform();   // world transform, reused by the light map
  const I = (x, y) => [x, y]; // world coords as-is
  drawSnow();
  drawRail(I, 1);
  ctx.globalAlpha = 1 - (1 - DIM_STANDING) * e;   // outside dims when standing
  drawBalloons(I, 1); drawArm(I, 1, 2 / viewScale); drawHornWaves(I, 1 / viewScale);
  ctx.globalAlpha = 1;
  drawSub();
  ctx.restore();
  applyLighting(M, frameDt);
  drawFog(M);
  if (gfxHigh) postFX(); else postFXLow();
}
// Everything drawn over the scene: red alarm edges, monitors, storage window, HUD
function drawOverlays(W, H) {
  if (redLight()) ctx.drawImage(alarmEdge(W, H), 0, 0);
  if (mode === 'seated' && !sub.dead) {
    if (zoomT > 0) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H); }
    const L = monitorLayout();
    if (parts.panel.broken && snapshot && terminalAlive()) {
      ctx.drawImage(snapshot, 0, 0); termButtons = [];
      ctx.fillStyle = '#f44'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
      ctx.fillText('PANEL FROZEN', L.cx, L.cy - L.R - 24);
    } else if (parts.panel.broken) { drawSonarScreen(L); drawTerminal(L); termButtons = []; }
    else { drawSonarScreen(L); drawTerminal(L); }
  }
  if (inv.open) drawInventory();
  drawFix();
  lowAirBlur(W, H);

  // Status bars and stock lines are dev-only (F3): in play, a part's status lives in its close-up (E on it)
  if (showF3) {
    bar(16, 14, 160, sub.hp / MAX_HP, sub.hp <= HIT_DAMAGE ? '#e44' : '#4c8', `HULL ${sub.hp}`);
    bar(16, 30, 160, fuel, fuel < 0.2 ? '#e44' : '#db5', `FUEL ${Math.round(fuel * 100)}%`);
    bar(16, 46, 160, air, air < 0.3 || !airMaking() ? '#e44' : '#9df', `AIR ${Math.round(air * 100)}%${airMaking() || phase === 'dock' ? '' : '  FALLING'}`);
    bar(16, 62, 160, water, water > ASCEND_LOCK ? '#e44' : '#48f', `WATER ${Math.round(water * 100)}%`);
    bar(16, 78, 160, Math.hypot(throttle.x, throttle.y), '#c8c', `THROTTLE (weight x${mass().toFixed(2)})`);
  }
  const hy = showF3 ? 110 : 20;
  ctx.font = '13px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = RELIC_COLOR; ctx.fillText(`COINS ${coins}`, 16, hy);
  ctx.fillStyle = '#ddd';
  if (showF3) {
    ctx.fillText(`METAL ${storedOf('METAL')}  COPPER ${storedOf('COPPER')}  PIPE ${storedOf('PIPE')}  FILTER ${storedOf('FILTER')}`, 16, 146);
    const l2 = `TRANSD ${storedOf('TRANSDUCER')}  GAS ${storedOf('GAS')}  CHARGES ${charges()}  `;
    ctx.fillText(l2, 16, 164);
    const hl = mod('HORN').loaded > 0; ctx.fillStyle = hl ? '#fa4' : '#e44';
    ctx.fillText(hl ? 'HORN LOADED' : 'HORN EMPTY', 16 + ctx.measureText(l2).width, 164);
    ctx.fillStyle = arm.broken ? '#e44' : arm.hits ? '#fa3' : '#4c8';
    ctx.fillText(arm.broken ? 'ARM BROKEN' : arm.hits ? 'ARM HIT' : 'ARM OK', 16, 182);
  }

  ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#7ab'; ctx.fillText(`DEPTH ${(sub.y / 10).toFixed(0)} m`, W / 2, 20);
  ctx.fillStyle = mode === 'seated' ? '#9cf' : '#fc6';
  ctx.fillText(mode === 'seated' ? 'SEATED' : 'STANDING', W / 2, 40);
  if (mode === 'standing') {
    const t = handTarget();
    const hint = fix ? (fix.panel ? (fix.game ? 'REPAIRING' : 'INSPECTING') : 'REPAIRING') : grip ? (grip.id === 'wheel' ? `CIRCLE THE MOUSE - BAY ${Math.round(hatch.progress * 100)}% OPEN` : 'CIRCLE THE MOUSE TO CRANK AIR')
      : t ? t.hint : canSit() ? 'F: SIT' : (fig.x >= SIT_RANGE[0] && fig.x <= SIT_RANGE[1] && seatUnderWater()) ? 'THE SEAT IS UNDER WATER - PUMP IT OUT' : 'A/D: WALK   MOUSE: HAND   E: USE   LMB: GRAB';
    ctx.font = '12px monospace'; ctx.fillStyle = '#ccc'; ctx.fillText(hint, W / 2, 58);
  }
  ctx.font = '12px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#7ab';
  const dbg = [`SPD ${Math.hypot(sub.vx, sub.vy).toFixed(0)}`, `CREATURE ${(Math.hypot(sub.x - creature.x, sub.y - creature.y) / 10).toFixed(0)} m`,
    `MODE ${mode}  FIG ${fig.x.toFixed(0)} face ${fig.face}`, `ENGINE ${engine.state}${engine.report ? ' ' + engine.report : ''}`, `RUN ${runTime.toFixed(0)}s  CHECKPOINT ${run.reached}`, `GFX ${gfxHigh ? 'HIGH' : 'LOW'} (G)  ${(1000 / frameAvg).toFixed(0)} fps`];
  if (showDebug) dbg.forEach((t, i) => ctx.fillText(t, W - 12, 18 + i * 16));
  else { ctx.fillStyle = '#566'; ctx.fillText(`TAB: CONTROLS${muted ? '   SOUND OFF' : ''}`, W - 12, 18); }
  drawTip();
  drawPartsDebug();
  drawHandbook();

  if (run.won && !sub.dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H / 2 - 60, W, 110);
    ctx.textAlign = 'center'; ctx.fillStyle = '#e8d8b0'; ctx.font = 'bold 36px monospace'; ctx.fillText('ATLANTIS', W / 2, H / 2 - 15);
    ctx.font = '15px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(`reached in ${Math.floor(runTime / 60)}:${String(Math.floor(runTime % 60)).padStart(2, '0')}  -  seed ${runSeed}  -  press R for a new run`, W / 2, H / 2 + 20);
  }
  if (sub.dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, H / 2 - 60, W, 110);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f44'; ctx.font = 'bold 36px monospace';
    ctx.fillText(`SUNK: ${failReason}`, W / 2, H / 2 - 15);
    ctx.font = '15px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(`lasted ${Math.floor(runTime / 60)}:${String(Math.floor(runTime % 60)).padStart(2, '0')}  -  press R to go back to ${run.reached ? 'checkpoint ' + run.reached : 'the surface'}`, W / 2, H / 2 + 20);
    if (DEATH_HINTS[failReason]) { ctx.fillStyle = '#9aa'; ctx.font = '12px monospace'; ctx.fillText(`next time: ${DEATH_HINTS[failReason]}`, W / 2, H / 2 + 42); }
  }
}

// ===================== LOOP =====================
let last = performance.now(), frameDt = 1 / 60;
function frame(now) {
  trackFrameTime(now - last);
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  frameDt = dt;
  if (!title) { update(dt); updateTips(dt); }
  updateAudio(dt);
  draw();
  requestAnimationFrame(frame);
}
resize(); buildTextures(); buildLevel(runSeed); reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
